<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashboard{% endblock %}</title>
  {% load static %}
  <!-- ✅ Librairie Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<div id="toast-container"></div>

<script>
function showToast(message, type="success") {
  const container = document.getElementById("toast-container");
  const toast = document.createElement("div");
  toast.className = "toast " + type;
  toast.innerText = message;
  container.appendChild(toast);

  setTimeout(() => toast.classList.add("show"), 100);

  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => toast.remove(), 500);
  }, 3000);
}
</script>

{% if messages %}
<script>
{% for message in messages %}
    showToast("{{ message }}", "{% if message.tags %}{{ message.tags }}{% else %}success{% endif %}");
{% endfor %}
</script>
{% endif %}



<body>
  <div class="layout">
    <!-- ✅ Sidebar -->
    <aside class="sidebar">
      <h2 class="logo">DZ Tech</h2>
      <nav>
        <ul>
          <li><a href="{% url 'dashboard' %}"><i class="bi bi-speedometer2"></i> Tableau de bord</a></li>
          <li><a href="{% url 'ordinateurs' %}"><i class="bi bi-pc-display"></i> Ordinateurs</a></li>
          <li><a href="#"><i class="bi bi-people"></i> Membres</a></li>
          <li><a href="#"><i class="bi bi-bar-chart"></i> Rapports</a></li>
          <li><a href="#"><i class="bi bi-gear"></i> Paramètres</a></li>
        </ul>
      </nav>
    </aside>

    <!-- ✅ Contenu principal -->
    <div class="main">
      <header>
        <h1> Gestion </h1>
      </header>

      <main>
        {% block content %}
        {% endblock %}
      </main>

      <footer>
        © 2026 Gestion Informatique - Frères de la Technologie
      </footer>
    </div>
  </div>
</body>
</html>



<script>
  
  // ✅ Filtre pour portables
  document.getElementById("searchPortable").addEventListener("keyup", function() {
    let filter = this.value.toLowerCase();
    let rows = document.querySelectorAll("#portableTable tbody tr");
    rows.forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(filter) ? "" : "none";
    });
  });

  // ✅ Filtre pour bureaux
  document.getElementById("searchBureau").addEventListener("keyup", function() {
    let filter = this.value.toLowerCase();
    let rows = document.querySelectorAll("#bureauTable tbody tr");
    rows.forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(filter) ? "" : "none";
    });
  });

 
  
function openModal() {
  document.getElementById("createModal").style.display = "flex";
}
function closeModal() {
  document.getElementById("createModal").style.display = "none";
}


</script>
