<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashboard{% endblock %}</title>
  {% load static %}
  <!-- ✅ Librairie Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<div id="toast-container"></div>

<script>
function showToast(message, type="success") {
  const container = document.getElementById("toast-container");
  const toast = document.createElement("div");
  toast.className = "toast " + type;
  toast.innerText = message;
  container.appendChild(toast);

  setTimeout(() => toast.classList.add("show"), 100);

  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => toast.remove(), 500);
  }, 3000);
}
</script>

{% if messages %}
<script>
{% for message in messages %}
    showToast("{{ message }}", "{% if message.tags %}{{ message.tags }}{% else %}success{% endif %}");
{% endfor %}
</script>
{% endif %}



<body>
  <div class="layout">
    <!-- ✅ Sidebar -->
    <aside class="sidebar">
      <h2 class="logo">DZ Tech</h2>
      <nav>
        <ul>
          <li><a href="{% url 'dashboard' %}"><i class="bi bi-speedometer2"></i> Tableau de bord</a></li>
          <li><a href="{% url 'ordinateurs' %}"><i class="bi bi-pc-display"></i> Ordinateurs</a></li>
          <li><a href="{% url 'employes' %}"><i class="bi bi-people"></i> Membres</a></li>
          <li><a href="#"><i class="bi bi-bar-chart"></i> Rapports</a></li>
          <li><a href="#"><i class="bi bi-gear"></i> Paramètres</a></li>
        </ul>
      </nav>
    </aside>

    <!-- ✅ Contenu principal -->
    <div class="main">
      <header>
        <h1> Gestion </h1>
      </header>

      <main>
        {% block content %}
        {% endblock %}
      </main>

      <footer>
        © 2026 Gestion Informatique - Frères de la Technologie
      </footer>
    </div>
  </div>
</body>
</html>



<script>
  
  // ✅ Filtre pour portables
  document.getElementById("searchPortable").addEventListener("keyup", function() {
    let filter = this.value.toLowerCase();
    let rows = document.querySelectorAll("#portableTable tbody tr");
    rows.forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(filter) ? "" : "none";
    });
  });

  // ✅ Filtre pour bureaux
  document.getElementById("searchBureau").addEventListener("keyup", function() {
    let filter = this.value.toLowerCase();
    let rows = document.querySelectorAll("#bureauTable tbody tr");
    rows.forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(filter) ? "" : "none";
    });
  });

 
  
function openModal() {
  document.getElementById("createModal").style.display = "flex";
}
function closeModal() {
  document.getElementById("createModal").style.display = "none";

}


function openDetailModal(type, modele, designation, numero, utilisateur, statut, date, garantie, duree) {
  // Remplir les champs du formulaire avec les valeurs passées
  document.getElementById("detail-type").value = type;
  document.getElementById("detail-modele").value = modele;
  document.getElementById("detail-designation").value = designation;
  document.getElementById("detail-numero").value = numero;
  document.getElementById("detail-utilisateur").value = utilisateur;
  document.getElementById("detail-statut").value = statut;
  document.getElementById("detail-date").value = date;
  document.getElementById("detail-garantie").value = garantie;
  document.getElementById("detail-duree").value = duree;

  // Afficher le modal
  document.getElementById("detailModal").style.display = "flex";
}

function closeDetailModal() {
  document.getElementById("detailModal").style.display = "none";
}




function openEditModal(id, type, modele, designation, numero, utilisateur, statut, date, garantie, duree) {
  document.getElementById("edit-type").value = type;
  document.getElementById("edit-modele").value = modele;
  document.getElementById("edit-designation").value = designation;
  document.getElementById("edit-numero").value = numero;
  document.getElementById("edit-utilisateur").value = utilisateur;
  document.getElementById("edit-statut").value = statut;
  document.getElementById("edit-date").value = date;
  document.getElementById("edit-garantie").value = garantie;
  document.getElementById("edit-duree").value = duree;

  document.querySelector("#editModal form").action = "/ordinateur/" + id + "/modifier/";

  document.getElementById("editModal").style.display = "flex";
}

function closeEditModal() {
  document.getElementById("editModal").style.display = "none";
}


function openDeleteModal(url) {
  // Injecte l’URL dans l’action du formulaire
  document.getElementById("deleteForm").action = url;

  // Affiche le modal
  document.getElementById("confirmDeleteModal").style.display = "flex";
}

function closeDeleteModal() {
  // Cache le modal
  document.getElementById("confirmDeleteModal").style.display = "none";
}


function openDetailEmploye(prenom, nom, email, poste, statut, ordinateurs, date_embauche) {
  document.getElementById("detail-prenom").value = prenom;
  document.getElementById("detail-nom").value = nom;
  document.getElementById("detail-email").value = email;
  document.getElementById("detail-poste").value = poste;
  document.getElementById("detail-statut").value = statut;
  document.getElementById("detail-ordinateurs").value = ordinateurs;
  document.getElementById("detail-date").value = date_embauche;
  document.getElementById("detailEmployeModal").style.display = "flex";
}
function closeDetailEmploye() {
  document.getElementById("detailEmployeModal").style.display = "none";
}

function openEditEmploye(id, prenom, nom, email, poste, statut, ordinateurs, date_embauche) {
  document.getElementById("edit-prenom").value = prenom;
  document.getElementById("edit-nom").value = nom;
  document.getElementById("edit-email").value = email;
  document.getElementById("edit-poste").value = poste;
  document.getElementById("edit-statut").value = statut;
  document.getElementById("edit-ordinateurs").value = ordinateurs;
  document.getElementById("edit-date").value = date_embauche;

  // ✅ Mettre l’action du formulaire dynamiquement
  document.getElementById("editEmployeForm").action = "/employe/modifier/" + id + "/";
  document.getElementById("editEmployeModal").style.display = "flex";
}
function closeEditEmploye() {
  document.getElementById("editEmployeModal").style.display = "none";
}


</script>
